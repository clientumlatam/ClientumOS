name: ClientumOS Periodic Tasks

on:
  schedule:
    # Runs every 15 minutes (100% free with GitHub Actions)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  run-periodic-sync:
    name: Trigger Google & CRM Sync
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Sync Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          SECRET="${CRON_SECRET:-cron_secret_clientum_2026}"
          echo "Disparando endpoint de sincronización en Vercel..."
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "https://www.clientum.com.ar/api/google/sync" \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Type: application/json")

          echo "Respuesta del servidor: HTTP $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "Sincronización completada exitosamente."
          else
            echo "Aviso: El endpoint devolvió un estado $RESPONSE."
          fi
