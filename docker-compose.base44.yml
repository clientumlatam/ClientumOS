services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      APP_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      ALLOWED_DOMAINS: localhost,127.0.0.1,3000-${BASE44_PUBLIC_HOST_SUFFIX}
      SESSION_SECRET: base44-local-development-session-secret
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    init: true

volumes:
  node_modules:
